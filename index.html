<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASCII Knight — Reverse Engineered & Enhanced</title>
  <meta name="description" content="Reverse engineered and enhanced recreation of ASCII Knight: an animated ASCII knight standing in a wind-swept grassy field with a billowing crimson cape, real-time physics, bloom, and procedural wind synthesizer.">
  <meta name="theme-color" content="#141518">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fullscreen Main Simulation Canvas -->
  <canvas id="view" aria-label="ASCII Knight with a billowing red cape standing in a wind-swept meadow"></canvas>

  <!-- Interactive Glassmorphism HUD -->
  <div class="hud-container" id="hud">
    <div class="hud-panel">
      <div class="hud-header">
        <div class="hud-title">
          <span class="dot"></span>
          <span>ASCII Knight</span>
        </div>
        <div class="hud-meta">
          <span class="badge" id="fps-badge">30 FPS</span>
          <span class="badge" id="grid-badge">--×--</span>
        </div>
      </div>

      <div class="hud-body" id="hud-body">
        <!-- Palette / Theme -->
        <div class="control-group">
          <label class="control-label" for="theme-select">Theme Palette</label>
          <select id="theme-select">
            <option value="classic">Classic Twilight (Original)</option>
            <option value="bloodmoon">Blood Moon (Scarlet)</option>
            <option value="emerald">Emerald Aurora (Mystic)</option>
            <option value="cyberpunk">Neon Synth (Cyber)</option>
            <option value="amber">Golden Hour (Sunset)</option>
          </select>
        </div>

        <!-- Wind Intensity Slider -->
        <div class="control-group">
          <div class="control-label">
            <span>Wind Force</span>
            <span class="control-val" id="wind-val">2.0</span>
          </div>
          <input type="range" id="wind-slider" min="0" max="5.0" step="0.1" value="2.0">
        </div>

        <!-- Cloth Wave Amplitude Slider -->
        <div class="control-group">
          <div class="control-label">
            <span>Cape Wave</span>
            <span class="control-val" id="wave-val">3.2</span>
          </div>
          <input type="range" id="wave-slider" min="0.5" max="6.0" step="0.1" value="3.2">
        </div>

        <!-- Grass Height Slider -->
        <div class="control-group">
          <div class="control-label">
            <span>Grass Height</span>
            <span class="control-val" id="grass-val">1.7</span>
          </div>
          <input type="range" id="grass-slider" min="0.5" max="3.0" step="0.1" value="1.7">
        </div>

        <!-- Bloom Glow Slider -->
        <div class="control-group">
          <div class="control-label">
            <span>Bloom Glow</span>
            <span class="control-val" id="glow-val">0.50</span>
          </div>
          <input type="range" id="glow-slider" min="0" max="1.0" step="0.05" value="0.5">
        </div>

        <!-- Primary Actions Row -->
        <div class="button-row">
          <button class="btn" id="play-btn" title="Toggle Play/Pause (Space)">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="currentColor">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
            <span>Pause</span>
          </button>

          <button class="btn" id="audio-btn" title="Toggle Procedural Wind Sound (M)">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
            <span>Wind: OFF</span>
          </button>
        </div>

        <!-- Secondary Utility Buttons Row -->
        <div class="button-row">
          <button class="btn btn-secondary" id="screenshot-btn" title="Save Wallpaper Image (S)">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
            <span>Screenshot</span>
          </button>

          <button class="btn btn-secondary" id="copy-ascii-btn" title="Copy ASCII Frame (C)">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span>Copy ASCII</span>
          </button>
        </div>

        <div class="button-row">
          <button class="btn btn-secondary" id="fullscreen-btn" title="Toggle Fullscreen (F)">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
            </svg>
            <span>Fullscreen</span>
          </button>

          <button class="btn btn-secondary" id="reset-btn" title="Reset to Defaults (R)">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
              <polyline points="1 4 1 10 7 10"></polyline>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </svg>
            <span>Reset</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Toggle Collapse Button -->
    <button class="hud-toggle-btn" id="hud-toggle-btn" title="Toggle Controls (H)">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </div>

  <!-- Bottom Shortcut Hint -->
  <div class="shortcut-hint" id="shortcut-hint">
    <span><span class="key-tag">SPACE</span> Pause</span>
    <span><span class="key-tag">H</span> Hide HUD</span>
    <span><span class="key-tag">M</span> Wind Audio</span>
    <span><span class="key-tag">S</span> Screenshot</span>
    <span><span class="key-tag">C</span> Copy Text</span>
    <span><span class="key-tag">F</span> Fullscreen</span>
  </div>

  <!-- Toast Notification Feedback -->
  <div class="toast" id="toast">Feedback message</div>

  <!-- Application Scripts -->
  <script src="knight-data.js"></script>
  <script src="audio.js"></script>
  <script src="ascii-knight.js"></script>
  <script src="ui.js"></script>
</body>
</html>
